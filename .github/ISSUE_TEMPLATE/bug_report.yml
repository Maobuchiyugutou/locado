name: Bug report
description: Report a reproducible problem in Locado
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and Locado commit or version.
      placeholder: Chrome 142, Windows 11, commit 5c38a27
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Console errors or screenshots
      description: Optional. Remove personal task content before attaching anything.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not include personal backup data.
          required: true
